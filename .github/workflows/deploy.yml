name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main          # production deploys
      - increment-4   # staging/preview deploys — remove when merged to main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_scholarchain/package-lock.json

      - name: Install dependencies
        working-directory: frontend_scholarchain
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pulls environment variables and project config from Vercel.
      # This is how Firebase env vars get injected — set them in
      # Vercel Dashboard → Project → Settings → Environment Variables.
      - name: Pull Vercel environment info
        working-directory: frontend_scholarchain
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        working-directory: frontend_scholarchain
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: frontend_scholarchain
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
